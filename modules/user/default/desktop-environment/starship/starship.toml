palette = "noctalia"
scan_timeout = 1
format = "[](text)[  ](bg:text fg:base)$hostname[](fg:text bg:subtext1)$directory[](fg:subtext1 bg:subtext0)$git_branch$git_status[](fg:subtext0 bg:surface2)$nodejs$rust$golang$php[](fg:surface2 bg:surface0)$time[](fg:surface0)$cmd_duration\n$character"

[hostname]
ssh_only = true
ssh_symbol = "󰢹 "
format = "[$hostname $ssh_symbol]($style)"
style = "bold bg:text fg:base"

[directory]
style = "fg:base bg:subtext1"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = false

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:subtext0"
format = "[[ $symbol $branch ](fg:base bg:subtext0)]($style)"

[git_status]
style = "bg:subtext0"
diverged = "[[  ${ahead_count} ${behind_count}](bg:subtext0 fg:base)]($style)"
ahead = "[[ ${count}](bg:subtext0 fg:base)]($style)"
behind = "[[ ${count}](bg:subtext0 fg:base)]($style)"
modified = "[[ !${count}](bg:subtext0 fg:base)]($style)"
staged = "[[ +${count}](bg:subtext0 fg:base)]($style)"
format = "[[($all_status$ahead_behind )](bg:subtext0 fg:base)]($style)"

[nix_shell]
symbol = " "
style = "bg:surface2 fg:text"
format = "[[ $symbol ($version) ](fg:text bg:surface2)]($style)"

[time]
disabled = false
time_format = "%r"
style = "bg:surface0"
format = "[[  $time ](fg:text bg:surface0)]($style)"

[cmd_duration]
min_time = 2000
min_time_to_notify = 45000
show_milliseconds = false
style = "light"
format = "[[  $duration](fg:subtext0)]($style)"

