config_version = 20

[backdrop]
enabled = true

[bar.default]
background_opacity = 0.69999998435378075
capsule_thickness = 0.68999998830258846
compositor_blur = false
end = [
    "tray",
    "notifications",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "control-center",
    "session"
]
margin_ends = "10%"
padding = 15
radius = 15
scale = 0.80000000447034836
start = [ "launcher", "wallpaper", "media", "wallhaven" ]
thickness = 23
widget_spacing = 10

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[lockscreen]
transition = [ "crt" ]
transition_duration = 800

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [
    "lockscreen-login-box@eDP-1",
    "lockscreen-login-box@WAYLAND-1",
    "lockscreen-login-box@FALLBACK",
    "lockscreen-widget-0000000000000001"
]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@FALLBACK"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "FALLBACK"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@FALLBACK".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_media_controls = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@WAYLAND-1"]
    box_height = 196.0
    box_width = 720.0
    cx = 153.5
    cy = 157.0
    output = "WAYLAND-1"
    placement_height = 339.0
    placement_width = 307.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@WAYLAND-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_media_controls = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 640.0
    cy = 568.33331298828125
    output = "eDP-1"
    placement_height = 720.0
    placement_width = 1280.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 0.98999999999999999
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_media_controls = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 48.0
    box_width = 240.0
    cx = 640.0
    cy = 384.0
    output = "eDP-1"
    placement_height = 720.0
    placement_width = 1280.0
    rotation = 0.0
    type = "BrettZolstick/username-on-lockscreen:username"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
        background = false

[plugins]
enabled = [ "BrettZolstick/username-on-lockscreen", "BrettZolstick/session-switcher" ]

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/maylton/noctalia-auto-tile-plugin"
    name = "maylton-plugins"

    [[plugins.source]]
    kind = "path"
    location = "/etc/nixos/nixos3000/modules/user/default/desktop-environment/noctalia/custom-plugins"
    name = "custom-plugins"

[shell]
card_borders = false
font_family = "VictorMono NFM SemiBold"
settings_window_translucent = true
setup_wizard_enabled = false
time_format = "{:%I:%M %p}"

    [shell.animation]
    speed = 1.7500000260770321

    [shell.launcher]
    app_grid = true
    categories = false
    layout = "simple"
    show_app_actions = true

    [shell.panel]
    clipboard_position = "auto"
    launcher_placement = "attached"
    transparency_mode = "glass"

    [shell.screen_corners]
    size = 53

    [shell.screenshot]
    copy_on_close = true
    save_to_file = false

    [shell.shadow]
    alpha = 0.53999998793005943
    direction = "down_right"

[theme]
builtin = "Gruvbox"
community_palette = "Heartbox"
mode = "dark"
pure_black_dark = true
source = "community"
wallpaper_scheme = "m3-monochrome"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "helix", "hyprland", "kcolorscheme", "kitty" ]
    community_ids = [ "starship", "yazi" ]

[wallpaper]
directory = "/etc/nixos/nixos3000/resources/wallpapers"
transition_duration = 800

    [wallpaper.default]
    path = "/etc/nixos/nixos3000/resources/wallpapers/Soyuz_rocket.jpg"

    [wallpaper.last]
    path = "/etc/nixos/nixos3000/resources/wallpapers/Soyuz_rocket.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/etc/nixos/nixos3000/resources/wallpapers/Soyuz_rocket.jpg"

    [[wallpaper.favorite]]
    community_palette = "Heartbox"
    palette_source = "community"
    path = "/etc/nixos/nixos3000/resources/wallpapers/Soyuz_rocket.jpg"
    theme_mode = "dark"

    [[wallpaper.favorite]]
    palette_source = "wallpaper"
    path = "/etc/nixos/nixos3000/resources/wallpapers/F1_Engine.jpg"
    theme_mode = "light"
    wallpaper_scheme = "m3-monochrome"

    [[wallpaper.favorite]]
    builtin_palette = "Gruvbox"
    palette_source = "builtin"
    path = "/etc/nixos/nixos3000/resources/wallpapers/Roscosmos.jpg"
    theme_mode = "dark"

    [[wallpaper.favorite]]
    community_palette = "Gruvbox Material Medium"
    palette_source = "community"
    path = "/etc/nixos/nixos3000/resources/wallpapers/Apollo_12_leaving_VAB.jpg"
    theme_mode = "dark"

[weather]
enabled = false

[widget.bluetooth]
enabled = false

[widget.brightness]
enabled = false

[widget.clipboard]
enabled = false

[widget.clock]
format = "{:%I:%M %p}"

[widget.wallhaven]
type = "noctalia/wallhaven:wallhaven"