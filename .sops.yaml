# In order to view/edit/add encrypted secrets, you will need a registered identity with access to that secret.
#
# Identities will be automatically generated at the following locations:
#   System-Level: /var/lib/sops-nix/keys.txt
#   User-Level: ~/.config/sops/keys.txt
#
# Get the public key with this command, pipe into qrencode to make a qr code:
#   nix-shell -p age qrencode
#   age-keygen -y <path to keys.txt> | qrencode -t ANSIUTF8
# 
# Then, manually add that public key here
#
# Afterwards you will need to update all encrypted secrets to accept the new identity
#
#   nix-shell -p sops
#   sops updatekeys secrets/*.yaml
keys:
  - &admin age1mtu96fcejjng3t645lk8y9x2hkxgel0wmawy6756hkvsvx7knddqtydzu4
  - &user-test age1at2lj6440a8ms4kk6kckppukxvrcrd4xd05c2xq9q42ctljmda8spvlef0
  - &host-testLaptop age14ugz55wp4mpddw75qraylrna4qc9k3242frremhm34rgm9funuasfdnt3k

creation_rules:

  # to add/encrypt a secret, make an entry pointing to the path of the yaml file you will make
  # give the desired age identities the access they need
  # then run "sops edit secrets/<file>.yaml"
  #
  # generate password hashes with "mkpasswd method=yescrypt"

  # Deploy key with read-only access to the repo
  - path_regex: ^secrets/nixos3000-deploy-key\.yaml$
    age:
      - *admin
      - *host-testLaptop
  
  # Root password for test-laptop 
  - path_regex: ^secrets/root-password-testLaptop\.yaml$
    age:
      - *admin
      - *host-testLaptop

  # Password for test user
  - path_regex: ^secrets/user-password-test\.yaml$
    age:
      - *admin
      - *host-testLaptop
      - *user-test

  # Password for personal user
  - path_regex: ^secrets/user-password-personal\.yaml$
    age:
      - *admin
      - *host-testLaptop
      # - *user-personal

  # Password for gaming user
  - path_regex: ^secrets/user-password-gaming\.yaml$
    age:
      - *admin
      - *host-testLaptop
      # - *user-gaming

  # Password for cookiegroup user
  - path_regex: ^secrets/user-password-cookiegroup\.yaml$
    age:
      - *admin
      - *host-testLaptop
      # - *user-cookiegroup

  # Password for plexus user
  - path_regex: ^secrets/user-password-plexus\.yaml$
    age:
      - *admin
      - *host-testLaptop
      # - *user-plexus

